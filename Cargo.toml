# A standalone workspace, so its dependency graph never widens Raven's. From a Raven checkout,
# pass `--manifest-path adapters/howl/Cargo.toml`.
[workspace]
resolver = "2"
members = ["poseidon2", "record", "indexer", "prefix-feed", "store"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.89"
authors = ["The Raven Authors"]
license = "Apache-2.0"
repository = "https://github.com/hisoka-io/raven-howl"
publish = false

[workspace.dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
tempfile = "3"
# Raven's durability primitives and PIR engine, resolved from the Raven checkout this
# repository sits in at `adapters/howl`.
raven-storage = { path = "../../crates/storage" }
raven-inspire = { path = "../../crates/inspire" }

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# Hashing, field arithmetic and the PIR engine under test are impractical at opt-level 0.
[profile.dev.package."*"]
opt-level = 2
