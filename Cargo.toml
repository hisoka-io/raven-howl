# A standalone workspace, so its dependency graph never widens Raven's. From a Raven checkout,
# pass `--manifest-path adapters/howl/Cargo.toml`.
[workspace]
resolver = "2"
members = ["poseidon2", "record"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.89"
authors = ["The Raven Authors"]
license = "Apache-2.0"
repository = "https://github.com/hisoka-io/raven-howl"
publish = false

[workspace.dependencies]
ark-bn254 = "0.5"
ark-ff = "0.5"
thiserror = "2"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
