name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: KAT, codec parity, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: verify Poseidon2 provenance
        run: poseidon2/check-provenance.sh
      - name: Poseidon2 provenance red-proof
        run: poseidon2/check-provenance-selftest.sh
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test (KAT + codec parity)
        run: cargo test --all-targets --locked
      - name: cargo test --doc
        run: cargo test --doc --locked

  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
